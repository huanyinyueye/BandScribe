# BandScribe model registry (spec section 4, 7, 8, 12.2).
#
# Rules
# - sha256: null means "not pinned yet". Nothing is pinned until the file has been
#   downloaded on this machine and hashed; hashes are never copied from memory.
#   `bandscribe.models.registry.verify_file` refuses to load a pinned file whose hash differs.
# - files: [] means the exact weight file(s) have not been resolved from the source page yet;
#   that happens in the milestone that integrates the model.
# - vram_gb.measured stays null until benchmarked on the RTX 3080 (MUST-BENCH, spec 12.2);
#   vram_gb.note carries only what the spec/source states.
# - status: default | candidate | baseline | disabled
# - verification uses the spec section-0 tags (V-SRC, V-2ND, CONFLICT, UNVERIFIED, MUST-BENCH).
