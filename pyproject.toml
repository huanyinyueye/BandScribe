[project]
name = "bandscribe"
version = "0.1.0"
description = "Local, quality-first band music transcription: audio -> full score + per-instrument parts (GP8 .gp, GP5, MIDI, MusicXML, PDF)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "imageio-ffmpeg>=0.5",
    "torch>=2.5",
    "numpy>=1.26",
    "beat-this>=1.1.0",
    "mir-eval>=0.8.2",
    "soundfile>=0.14.0",
    "scipy>=1.17.1",
    "bs-roformer-infer>=0.1.5",
    "ml-collections>=1.1.0",
    "omegaconf>=2.4.0",
    "beartype>=0.23.1",
    "demucs>=4.0.1",
    "hyper-connections>=0.4.11",
]

[project.scripts]
bandscribe = "bandscribe.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bandscribe"]

[tool.uv.sources]
torch = { index = "pytorch-cuda" }

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs a real CUDA device (skipped when unavailable)",
    "slow: long-running benchmark-style test",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "SIM117"]
