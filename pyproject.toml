[project]
name = "bandscribe"
version = "0.1.0"
description = "Local, quality-first band music transcription: audio -> full score + per-instrument parts (GP8 .gp, GP5, MIDI, MusicXML, PDF)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "imageio-ffmpeg>=0.5",
    "torch>=2.5",
    "numpy>=1.26",
]

[project.scripts]
bandscribe = "bandscribe.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bandscribe"]

[tool.uv.sources]
torch = { index = "pytorch-cuda" }

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs a real CUDA device (skipped when unavailable)",
    "slow: long-running benchmark-style test",
]

[tool.ruff]
line-length = 100
target-version = "py311"
